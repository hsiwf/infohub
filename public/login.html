<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 · 信息汇总</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#4f6ef2">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef1fb,#f7f5ff);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;padding:20px}
  .card{background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(30,41,80,.14);padding:34px 30px;width:100%;max-width:360px;text-align:center;animation:l-in .45s ease both}
  @keyframes l-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .logo{font-size:26px;font-weight:700;margin-bottom:4px}
  .sub{color:#6b7280;font-size:13px;margin:0 0 22px}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #dde3ee;border-radius:12px;outline:none;text-align:center}
  input:focus{border-color:#4f6ef2}
  button{width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:12px;background:linear-gradient(135deg,#4f6ef2,#6a86f5);color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(79,110,242,.30);transition:filter .15s,transform .12s}
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.6}
  .msg{color:#ef4444;font-size:13px;min-height:18px;margin:12px 0 0}
  .hint{color:#9aa3b2;font-size:11px;margin-top:18px;line-height:1.6}
  @media (prefers-color-scheme:dark){
    body{background:linear-gradient(135deg,#141922,#1b1726)}
    .card{background:#1d2430;box-shadow:0 12px 40px rgba(0,0,0,.5)}
    .logo{color:#e6eaf2}
    .sub{color:#8a94a6}
    input{background:#141922;border-color:#2b3442;color:#e6eaf2}
    input:focus{border-color:#5b78ff}
    .hint{color:#6b7280}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#4f6ef2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;vertical-align:-5px" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 7L22 7"/></svg> 信息汇总</div>
    <p class="sub">管理员登录</p>
    <input id="pw" type="password" placeholder="请输入管理员密码" autofocus
           onkeydown="if(event.key==='Enter')go()">
    <button id="btn" onclick="go()">进 入</button>
    <p class="msg" id="msg"></p>
    <p class="hint">学生/家长无需密码即可浏览<br>此密码仅用于发布、修改内容（管理员）<br>由部署者在 data/config.json 的 password 字段设置</p>
  </div>
<script>
// 已登录的管理员访问登录页时直接回主界面
fetch('/api/me').then((r) => r.json()).then((me) => {
  if (me && me.authRequired && me.loggedIn) location.replace('/');
}).catch(() => {});
async function go() {
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  if (!pw) { msg.textContent = '请输入密码'; return; }
  btn.disabled = true; btn.textContent = '验证中…'; msg.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    msg.textContent = j.error || '密码不对';
  } catch (e) {
    msg.textContent = '网络错误，请重试';
  }
  btn.disabled = false; btn.textContent = '进 入';
}
</script>
</body>
</html>
