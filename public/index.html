<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>信息汇总</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f6ef2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="信息汇总">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo"><svg class="icon logo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><b>信息汇总</b><span class="logo-sub">重要通知不遗漏</span></div>
    <nav id="mainnav">
      <button data-view="feed" class="active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M16 4v16"/><path d="M7 9h5M7 13h5M7 17h3"/></svg>信息中心</button>
      <button data-view="jielong"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg>活动接龙</button>
      <button data-view="draw"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M9 3v6M15 3v6"/><path d="m9 14 2 2 4-4"/></svg>抽签点名</button>
      <button data-view="vote"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V5h8v5"/><path d="m9.5 14 2 2 3.5-3.5"/></svg>投票表决</button>
      <button data-view="survey"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><path d="M9 18h6"/></svg>问卷调查</button>
      <button data-view="birthday"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-4 2.5-2.5 6.5-2.5 6.5S13.5 13 12 17c-.8 2.2-3 3-5.5 3A8.5 8.5 0 0 1 12 3z"/><path d="M7 13.5A8.5 8.5 0 0 1 17 13.5c2 .8 2.5 2.7 2.5 5H4.5c0-3 .8-5 2.5-5z"/></svg>生日祝福</button>
      <button data-view="funds"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><path d="M16 12v6"/><circle cx="16" cy="13" r="1.3"/></svg>班费收支</button>
      <button data-view="guestbook"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>思维碰撞</button>
      <button data-view="rosters" class="admin-only"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>班级管理</button>
    </nav>
    <div class="side-sec">
      <div class="side-title">群列表 <button id="btn-add-group" class="admin-only" title="添加群" aria-label="添加群"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div id="grouplist"></div>
    </div>
    <div class="side-foot">数据保存在本机 data/ 文件夹<br>双击群名可编辑</div>
  </aside>
  <div id="right">
    <header id="topbar">
      <div class="searchwrap">
        <input id="search" type="search" placeholder="搜索标题、内容、发送人、标签…" aria-label="搜索信息">
        <kbd class="search-kbd" title="按 / 聚焦搜索">/</kbd>
      </div>
      <select id="group-sel" aria-label="按群筛选"></select>
      <select id="sortsel" aria-label="排序方式">
        <option value="time">最近收到</option>
        <option value="deadline">按截止时间</option>
      </select>
      <button id="btn-theme" class="iconbtn" title="深色 / 浅色模式" aria-label="切换外观"></button>
      <button id="btn-bell" class="iconbtn" title="截止提醒：开启浏览器通知" aria-label="截止提醒"></button>
      <button id="btn-install" class="iconbtn" title="安装到桌面 / 主屏幕" aria-label="安装应用" style="display:none"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v7M9 12l3 3 3-3"/></svg></button>
      <button id="me-chip" class="iconbtn mechip" title="账号与退出登录" aria-label="当前登录身份" style="display:none"></button>
      <button id="btn-logout" class="iconbtn" title="退出登录" aria-label="退出登录" style="display:none"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      <button id="btn-login" class="iconbtn" title="登录" aria-label="登录" style="display:none"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button id="btn-add" class="primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>添加信息</span></button>
    </header>
    <div id="hub-bar"></div>
    <div id="chips"></div>
    <main id="view"><div class="loading">加载中…</div></main>
  </div>
</div>
<nav id="tabbar">
  <button data-view="feed" class="active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h13a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M16 4v16"/><path d="M7 9h5M7 13h5M7 17h3"/></svg><span>信息</span></button>
  <button data-view="vote"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V5h8v5"/><path d="m9.5 14 2 2 3.5-3.5"/></svg><span>投票</span></button>
  <button data-view="survey"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><path d="M9 18h6"/></svg><span>问卷</span></button>
  <button data-view="jielong"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="4" cy="18" r="1.6"/></svg><span>接龙</span></button>
  <button data-view="draw"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M9 3v6M15 3v6"/><path d="m9 14 2 2 4-4"/></svg><span>抽签</span></button>
  <button data-view="birthday"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-4 2.5-2.5 6.5-2.5 6.5S13.5 13 12 17c-.8 2.2-3 3-5.5 3A8.5 8.5 0 0 1 12 3z"/><path d="M7 13.5A8.5 8.5 0 0 1 17 13.5c2 .8 2.5 2.7 2.5 5H4.5c0-3 .8-5 2.5-5z"/></svg><span>生日</span></button>
  <button id="tab-more" class="morebtn" aria-label="更多页面"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>更多</span></button>
</nav>
<div id="tabsheet" class="more-sheet" hidden>
    <button data-view="rosters" class="admin-only"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>班级管理</span></button>
  <button data-view="funds"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><path d="M16 12v6"/><circle cx="16" cy="13" r="1.3"/></svg><span>班费收支</span></button>
  <button data-view="guestbook"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg><span>思维碰撞</span></button>
</div>
<button id="fab" title="添加信息" aria-label="添加信息"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
<script src="/js/app.js"></script>
</body>
</html>
