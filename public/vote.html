<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投票 · 信息汇总</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --pri:#4f6ef2; --pri-d:#3d5bd9; --bg:#f4f6fb; --card:#fff;
    --tx:#1f2937; --tx2:#6b7280; --bd:#e5e9f2;
    --ok:#0d9668; --warn:#ea6a12; --danger:#ef4444;
  }
  :root[data-theme="dark"]{
    --pri:#5b78ff; --pri-d:#4a66e8; --bg:#141922; --card:#1d2430;
    --tx:#e6eaf2; --tx2:#8a94a6; --bd:#2b3442;
    --ok:#4ade80; --warn:#fdba74;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.65 system-ui,-apple-system,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:14px 14px 46px}
  .top{padding:12px 4px 10px;display:flex;align-items:center;gap:8px}
  .top a{margin-left:auto;font-size:13px;color:var(--pri);text-decoration:none}
  .logo{font-size:18px;font-weight:700}
  .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.07);margin-bottom:14px}
  .card h1{font-size:21px;margin:6px 0;line-height:1.4;word-break:break-word}
  .card h2{font-size:16px;margin:0 0 6px}
  .act-desc{white-space:pre-wrap;color:var(--tx2);margin:6px 0;font-size:14.5px}
  .act-meta{font-size:13px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge.on{background:#e6f8f1;color:#0d9668}
  :root[data-theme="dark"] .badge.on{background:rgba(16,185,129,.16);color:#4ade80}
  .badge.off{background:#eef2f6;color:#64748b}
  .prog-num{font-size:14px;color:var(--tx2);margin-bottom:8px}
  .prog-num b{font-size:30px;color:var(--tx);font-weight:700}
  .prog-num .sep{margin:0 4px;font-size:20px}
  .prog-num .unit{margin-left:8px;font-size:13.5px}
  .progress{height:10px;background:var(--bd);border-radius:99px;overflow:hidden}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f6ef2,#3ddc84);border-radius:99px;transition:width .4s}
  .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--card)}
  .opt:hover{border-color:var(--pri)}
  .opt input{width:17px;height:17px;accent-color:var(--pri);flex:0 0 auto}
  .opt .olabel{flex:1;word-break:break-word}
  .opt.checked{border-color:var(--pri);background:rgba(79,110,242,.06)}
  .tally-row{margin:10px 0}
  .tally-row .tlabel{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:4px}
  .tally-row .tlabel b{word-break:break-word;margin-right:8px}
  .tally-row .tbar{height:9px;background:var(--bd);border-radius:99px;overflow:hidden}
  .tally-row .tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f6ef2,#7c5cf5);border-radius:99px;transition:width .4s}
  .fl{display:block;font-size:13px;color:var(--tx2);margin:14px 0 6px}
  .req{color:var(--danger)}
  input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:15px;font-family:inherit;background:var(--card);color:var(--tx)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri)}
  .name-wrap{position:relative}
  .sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:20;max-height:238px;overflow:auto}
  .sugg div{padding:10px 14px;cursor:pointer;font-size:15px}
  .sugg div:hover{background:rgba(79,110,242,.08)}
  .match-hint{font-size:13px;min-height:20px;margin-top:6px}
  .ok-t{color:var(--ok)} .warn-t{color:var(--warn)}
  .locked-hint{font-size:13px;background:rgba(13,150,104,.08);border:1px solid rgba(13,150,104,.3);border-radius:10px;padding:8px 12px;margin-top:8px}
  .locked-hint a{color:var(--pri);cursor:pointer}
  .ok-banner{background:rgba(13,150,104,.08);border:1px solid rgba(13,150,104,.3);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px}
  .warn-banner{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--pri);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:15.5px;font-weight:600;cursor:pointer;width:100%;margin-top:16px}
  .btn:disabled{opacity:.55;cursor:default}
  .btn:active{background:var(--pri-d)}
  .privacy-tip{font-size:12px;color:var(--tx2);margin-top:10px;text-align:center}
  .qtheme{position:fixed;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:15px;line-height:1;z-index:5}
  .qtheme .icon{width:16px;height:16px;stroke-width:1.9}
  .logo .icon{width:19px;height:19px;vertical-align:-3.5px;color:var(--pri);stroke-width:1.9}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;display:none;max-width:86vw;text-align:center}
  .errbox h2{margin:4px 0 8px}
  .errbox p{color:var(--tx2);font-size:13.5px;margin:4px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="logo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V5h8v5"/><path d="m9.5 14 2 2 3.5-3.5"/></svg> 班级投票 · 信息汇总</div><a href="/">打开信息汇总 →</a></header>

  <div class="card errbox" id="errBox" style="display:none">
    <h2>打不开这个投票</h2>
    <p id="errMsg">投票不存在或链接有误</p>
    <p>链接可能有误，或该投票已被发起人删除。</p>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <span class="badge on" id="statusBadge"></span>
      <h1 id="vTitle"></h1>
      <p id="vDesc" class="act-desc"></p>
      <div class="act-meta" id="vMeta"></div>
    </div>

    <div class="card">
      <div class="prog-num" id="progNum"></div>
      <div class="progress"><i id="progBar"></i></div>
      <div class="prog-sub" id="progSub"></div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <h2>实时票数</h2>
      <div id="tallyBox"></div>
    </div>

    <div class="card" id="ballotCard">
      <h2 id="formTitle" style="font-size:16px;margin:0 0 4px">投票</h2>
      <div id="closedBanner" class="warn-banner" style="display:none"></div>
      <div id="okBanner" class="ok-banner" style="display:none"></div>
      <div id="formBody">
        <label class="fl"><span id="nameLabel">你的姓名或学号</span> <span class="req">*</span></label>
        <div class="name-wrap">
          <input type="text" id="name" maxlength="60" placeholder="输入姓名或学号，从名单中选择" autocomplete="off">
          <div class="sugg" id="sugg" style="display:none"></div>
        </div>
        <div class="match-hint" id="matchHint"></div>
        <div class="locked-hint" id="lockedHint" style="display:none"></div>
        <div id="optBox"></div>
        <button class="btn" id="submitBtn" type="button">投出选票</button>
        <div class="privacy-tip" id="privacyTip">提交后如需改票，改完再次提交即可覆盖（截止前）。</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toastEl"></div>
<button class="qtheme" id="q-theme" title="深色 / 浅色模式"></button>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function pad2(n){return String(n).padStart(2,'0');}
function fmtDT(s){if(!s)return '';const d=new Date(String(s).replace(' ','T'));return isNaN(d)?'':d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmtRemain(ms){const m=Math.max(0,Math.floor(ms/60000));const d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;if(d>0)return d+' 天 '+h+' 小时';if(h>0)return h+' 小时 '+mm+' 分钟';return mm+' 分钟';}
function slotLabel(r){return r.id ? r.id + ' ' + r.name : r.name;}
let toastTimer=null;
function toast(msg){const t=$('#toastEl');t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.display='none';},2200);}
async function api(url,opt){
  let r;
  try{r=await fetch(url,opt);}
  catch(_){throw new Error('网络异常，请稍后重试');}
  let j=null;
  try{j=await r.json();}catch(_){}
  if(!r.ok){throw new Error((j&&j.error)||('请求失败('+r.status+')'));}
  return j;
}

const VOTE_ID=((location.pathname.match(/\/v\/([a-z0-9]+)/i)||[])[1]||'').toLowerCase();
let act=null;
let pickedRid=null;   // 锁定的名单槽位
const urlRid=(()=>{
  const raw=new URLSearchParams(location.search).get('u');
  if(raw==null||raw==='')return null;
  const n=Number(raw);
  return Number.isInteger(n)&&n>=0?n:null;
})();

init();
async function init(){
  if(!VOTE_ID)return showError('投票不存在或链接有误');
  try{act=await api('/api/vote/'+VOTE_ID);}
  catch(e){return showError(e.message);}
  document.title=act.title+' · 投票';
  $('#main').style.display='';
  renderHead();
  renderProgress();
  renderTally();
  renderBallot();
  setInterval(refresh,10000);
}
function showError(msg){$('#errBox').style.display='';$('#errMsg').textContent=msg;}

function renderHead(){
  const open=!act.closed;
  $('#statusBadge').textContent=open?'投票进行中':(act.closedByAdmin?'发起人已停止':'投票已结束');
  $('#statusBadge').className='badge '+(open?'on':'off');
  $('#vTitle').textContent=act.title;
  $('#vDesc').textContent=act.description||'';
  const meta=[];
  if(act.deadline)meta.push('截止：'+fmtDT(act.deadline));
  if(open&&act.deadline){
    const remain=new Date(String(act.deadline).replace(' ','T'))-new Date();
    if(remain>0)meta.push('剩余 '+fmtRemain(remain));
  }
  meta.push(act.anonymous?'匿名投票（同学间互不可见，仅发起人可查明细）':'记名投票（选择对所有人公开）');
  meta.push(act.maxSelect>1?`每人最多投 ${act.maxSelect} 项`:'每人一票');
  $('#vMeta').innerHTML=meta.map((m)=>'<span>'+esc(m)+'</span>').join('');
}

function renderProgress(){
  $('#progNum').innerHTML='<b>'+act.done+'</b><span class="sep">/</span>'+act.rosterSize+'<span class="unit">人已完成投票</span>';
  const pct=act.rosterSize?Math.min(100,Math.round(act.done*100/act.rosterSize)):0;
  $('#progBar').style.width=pct+'%';
  $('#progSub').textContent='只有名单内的同学可以投票；重名请用学号确认身份';
}

function renderTally(){
  $('#resultCard').style.display='';
  const max=Math.max(1,...act.tally.map((t)=>t.votes));
  const totalVotes=act.tally.reduce((s,t)=>s+t.votes,0);
  $('#tallyBox').innerHTML=act.tally.map((t)=>{
    const pct=Math.round(t.votes*100/max);
    const pctTxt=totalVotes?Math.round(t.votes*100/totalVotes)+'%':'0%';
    return `<div class="tally-row"><div class="tlabel"><b>${esc(t.label)}</b><span>${t.votes} 票 · ${pctTxt}</span></div><div class="tbar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}

function renderBallot(){
  const closed=act.closed;
  if(closed){
    $('#closedBanner').textContent=(act.closedByAdmin?'发起人已停止投票':'投票已结束')+'，以下为最终票数';
    $('#closedBanner').style.display='';
    $('#formBody').style.display='none';
    $('#formTitle').textContent='投票结果';
    return;
  }
  // 专属链接 ?u= 序号锁定身份
  if(urlRid!=null&&act.roster[urlRid]){
    pickedRid=urlRid;
    $('#nameLabel').textContent='投票身份';
    $('#name').value=slotLabel(act.roster[urlRid]);
    $('#name').readOnly=true;
    $('#lockedHint').innerHTML='当前以 <b>'+esc(slotLabel(act.roster[urlRid]))+'</b> 的身份投票。不是本人？<a id="unlockBtn">解锁</a>';
    $('#lockedHint').style.display='';
    $('#unlockBtn').addEventListener('click',()=>{
      pickedRid=null;
      $('#name').readOnly=false;$('#name').value='';
      $('#lockedHint').style.display='none';
      updateMatchHint();
    });
  }
  if(act.requireSid){
    $('#nameLabel').textContent='你的学号（需学号验证）';
    $('#name').placeholder='输入你的学号进行投票';
  }
  renderOptions();
  const nameInput=$('#name');
  nameInput.addEventListener('input',()=>{pickedRid=null;updateSugg();updateMatchHint();});
  nameInput.addEventListener('blur',()=>setTimeout(()=>{$('#sugg').style.display='none';},150));
  updateMatchHint();
}

function renderOptions(){
  const multi=act.maxSelect>1;
  $('#formTitle').textContent=multi?`投票（最多选 ${act.maxSelect} 项）`:'投票（单选）';
  $('#optBox').innerHTML=act.options.map((o)=>`
    <label class="opt"><input type="${multi?'checkbox':'radio'}" name="vote-opt" value="${esc(o.key)}"><span class="olabel">${esc(o.label)}</span></label>`).join('');
  $('#optBox').addEventListener('change',()=>{
    const checked=[...document.querySelectorAll('#optBox input:checked')];
    if(checked.length>act.maxSelect){
      checked[checked.length-1].checked=false;
      toast(`最多选择 ${act.maxSelect} 项`);
    }
    document.querySelectorAll('#optBox .opt').forEach((el)=>{
      el.classList.toggle('checked',el.querySelector('input').checked);
    });
  });
}

function updateSugg(){
  const q=$('#name').value.trim();
  const sugg=$('#sugg');
  if(!q||!act.roster.length){sugg.style.display='none';return;}
  const m=act.roster.map((r,i)=>({r,i}))
    .filter((x)=>slotLabel(x.r).includes(q)||x.r.name.includes(q)||(x.r.id&&x.r.id.includes(q)))
    .slice(0,8);
  if(!m.length){sugg.style.display='none';return;}
  sugg.innerHTML=m.map((x)=>'<div data-i="'+x.i+'">'+esc(slotLabel(x.r))+'</div>').join('');
  sugg.style.display='';
  sugg.querySelectorAll('div').forEach((d)=>d.addEventListener('mousedown',(ev)=>{
    ev.preventDefault();
    pickedRid=+d.dataset.i;
    $('#name').value=slotLabel(act.roster[pickedRid]);
    sugg.style.display='none';
    updateMatchHint();
  }));
}
function findHits(q){
  return (act.roster||[]).map((r,i)=>({r,i})).filter((x)=>x.r.name===q||(x.r.id&&x.r.id===q));
}
function updateMatchHint(){
  const q=$('#name').value.trim();
  const h=$('#matchHint');
  if(!q||!act.roster.length){h.innerHTML='';return;}
  if(pickedRid!=null&&act.roster[pickedRid]){
    h.innerHTML='<span class="ok-t">✓ 与名单匹配：'+esc(slotLabel(act.roster[pickedRid]))+'</span>';
    return;
  }
  const hits=findHits(q);
  if(hits.length===1){
    pickedRid=hits[0].i;
    h.innerHTML='<span class="ok-t">✓ 与名单匹配：'+esc(slotLabel(hits[0].r))+'</span>';
    return;
  }
  if(hits.length>1){h.innerHTML='<span class="warn-t">名单中有重名，请输入学号确认身份</span>';return;}
  h.innerHTML='<span class="warn-t">「'+esc(q)+'」不在投票名单中</span>';
}

$('#submitBtn').addEventListener('click',async()=>{
  const name=$('#name').value.trim();
  if(!name){toast('请填写你的姓名或学号');$('#name').focus();return;}
  const choices=[...document.querySelectorAll('#optBox input:checked')].map((el)=>el.value);
  // 需学号验证的投票：资格名单已对客户端打码（不含学号），名单与学号校验交给服务端
  if(!act.requireSid){
    if(act.roster.length&&pickedRid==null&&findHits(name).length===0){
      toast('「'+name+'」不在投票名单中，无法投票');return;
    }
    if(act.roster.length&&pickedRid==null&&findHits(name).length>1){
      toast('名单中有重名，请输入学号确认身份');return;
    }
  }
  let sid='';
  if(!act.requireSid&&pickedRid!=null&&act.roster[pickedRid]&&act.roster[pickedRid].id){sid=act.roster[pickedRid].id;}
  const btn=$('#submitBtn');
  btn.disabled=true;btn.textContent='提交中…';
  try{
    const r=await api('/api/vote/'+VOTE_ID+'/ballot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rid:pickedRid,name,choices,sid})});
    $('#okBanner').textContent=r.updated?'✓ 已更新你的选票':'✓ 投票成功，感谢参与';
    $('#okBanner').style.display='';
    toast(r.updated?'选票已更新':'投票成功');
    await refresh();
  }catch(e){
    toast(e.message);
    btn.textContent='投出选票';
  }
  btn.disabled=false;
});

let lastClosed=null; // 用于在轮询中发现投票刚截止/被停止，及时把表单切换成结果态
async function refresh(){
  let a2;
  try{a2=await api('/api/vote/'+VOTE_ID);}catch(_){return;}
  act=a2;
  renderHead();
  renderProgress();
  renderTally();
  if(act.closed!==lastClosed){ // 截止/停止后把表单切换成结果态
    lastClosed=act.closed;
    if(act.closed)renderBallot();
  }
}

/* ---------- 主题 ---------- */
(function(){
  const ICON_MOON='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 8.5 8.5 0 0 0 21 12.8z"/></svg>';
  const ICON_SUN='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 6.3l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 17.7l1.4-1.4"/></svg>';
  const t=(()=>{const v=localStorage.getItem('infohub-theme')||'auto';if(v!=='auto')return v;const h=new Date().getHours();return (h>=19||h<7)?'dark':'light';})();
  document.documentElement.dataset.theme=t;
  const btn=$('#q-theme');
  const draw=()=>{btn.innerHTML=document.documentElement.dataset.theme==='dark'?ICON_SUN:ICON_MOON;};
  draw();
  btn.addEventListener('click',()=>{
    const cur=document.documentElement.dataset.theme==='dark'?'dark':'light';
    const next=cur==='dark'?'light':'dark';
    document.documentElement.dataset.theme=next;
    localStorage.setItem('infohub-theme',next);
    draw();
  });
})();
</script>
</body>
</html>
