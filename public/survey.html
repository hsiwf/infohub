<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问卷调查 - 信息汇总</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .survey-container { max-width: 720px; margin: 0 auto; padding: 20px; }
    .survey-header { background: var(--card); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .survey-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .survey-desc { font-size: 14px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; }
    .survey-meta { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--muted); }
    .question-card { background: var(--card); border-radius: var(--radius-md); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border-left: 3px solid var(--primary); }
    .q-label { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
    /* .q-required / .q-description 的外观已提到全站 style.css，这里只留本页的几何差 */
    .q-description { margin: -4px 0 10px 0; }
    .option-list { display: flex; flex-direction: column; gap: 8px; }
    .option-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; transition: all .15s; }
    .option-item:hover { background: color-mix(in srgb, var(--primary) 6%, transparent); border-color: var(--primary); }
    .option-item input[type="radio"], .option-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .option-item label { flex: 1; font-size: 14px; color: var(--text); cursor: pointer; }
    .text-answer { width: 100%; min-height: 80px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; background: var(--card); color: var(--text); }
    .text-answer:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,242,.1); }
    .submit-bar { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
    .progress-info { font-size: 14px; color: var(--muted); }
    .btn-submit { padding: 10px 24px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-submit:hover { background: color-mix(in srgb, var(--primary) 85%, black); }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .filled-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border-radius: 999px; font-size: 13px; font-weight: 600; }
    .result-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    .result-table th, .result-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    .result-table th { background: color-mix(in srgb, var(--card) 70%, transparent); font-weight: 600; color: var(--text); }
    .result-table td { color: var(--text); }
    .stat-bar { height: 24px; background: var(--primary); border-radius: 4px; display: inline-block; min-width: 4px; transition: width .3s; }
    /* 令牌名是 --warn / --success（此前误写成 --warning，解析为空导致横幅一直没样式） */
    .closed-banner { background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid var(--warn); color: var(--warn); padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    /* 匿名说明条：与上面的已截止横幅同一套写法，用主题变量而非写死的浅色值（深色下才不会是一块亮板） */
    .anon-note { margin-top: 8px; padding: 8px 12px; background: color-mix(in srgb, var(--primary) 8%, transparent); border-radius: 8px; font-size: 13px; color: var(--primary); line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app">
    <div class="survey-container" id="survey-view"></div>
  </div>
  <script>
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const icon = (name) => `<svg class="icon" viewBox="0 0 24 24"><use href="#${name}"></use></svg>`;

    let surveyId = '';
    let surveyData = null;
    let answers = {};

    async function loadSurvey() {
      // 支持两种格式：/survey/ID 或 /survey.html?id=ID
      surveyId = location.pathname.split('/').pop();
      if (!surveyId || surveyId === 'survey.html') {
        const params = new URLSearchParams(location.search);
        surveyId = params.get('id') || '';
      }
      if (!surveyId) {
        $('#survey-view').innerHTML = '<div class="loading">无效的问卷链接</div>';
        return;
      }
      try {
        const resp = await fetch(`/api/survey/${surveyId}`);
        const d = await resp.json();
        if (d.error) {
          if (d.authRequired) {
            // 需要登录，走全站统一的 next 约定（login.html 与静态服务都只认 next）
            location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
            return;
          }
          $('#survey-view').innerHTML = `<div class="survey-header"><div class="survey-title">加载失败</div><p class="hint">${esc(d.error)}</p></div>`;
          return;
        }
        surveyData = d;
        renderSurvey();
      } catch (e) {
        console.error('加载问卷失败:', e);
        $('#survey-view').innerHTML = '<div class="loading">网络错误，请刷新重试</div>';
      }
    }

    function renderSurvey() {
      const d = surveyData;
      const closed = d.closed;
      const isFilled = d.filled;

      let html = '';
      // 头部信息
      html += `<div class="survey-header">
        <div class="survey-title">${esc(d.title)}${d.anonymous ? ' <span style="font-size:13px;color:var(--muted);font-weight:normal">[匿名]</span>' : ''}</div>
        ${d.description ? `<div class="survey-desc">${esc(d.description)}</div>` : ''}
        <div class="survey-meta">
          <span>${icon('users')} ${d.rosterSize} 人可填</span>
          <span>${icon('check')} ${d.done} 人已提交</span>
          ${d.deadline ? `<span>${icon('clock')} 截止 ${esc(d.deadline)}</span>` : ''}
        </div>
        ${d.anonymous ? `<div class="anon-note">${icon('lock')} 本问卷为匿名提交：回答不署名、同学之间互不可见；管理员仅按名单核对填写情况</div>` : ''}
      </div>`;

      // 已截止提示
      if (closed) {
        html += `<div class="closed-banner">${icon('lock')} 本问卷已截止，无法提交</div>`;
      }

      // 已填写提示
      if (isFilled) {
        html += `<div style="margin-bottom:16px">
          <span class="filled-badge">${icon('check')} 你已提交过本问卷</span>
          ${!closed ? `<button class="btn-submit" id="btn-edit-answers" style="margin-left:12px;padding:6px 16px;font-size:13px">${icon('edit')} 修改答案</button>` : ''}
        </div>`;
      }
      
      // 始终显示可编辑的表单（已提交过的话预填答案）
      if (!closed) {
        html += renderQuestions();
        // 提交栏
        html += renderSubmitBar();
      }

      $('#survey-view').innerHTML = html;
      
      // 如果已提交过，预填答案
      if (isFilled && surveyData.myAnswers) {
        prefillAnswers(surveyData.myAnswers);
      }
      
      bindEvents();
    }

    function renderQuestions() {
      let html = '';
      for (const q of surveyData.questions) {
        html += `<div class="question-card" data-qid="${q.id}">
          <div class="q-label">${esc(q.question)}${q.required ? '<span class="q-required">*</span>' : ''}</div>`;
        
        // 显示问题描述（如果有）
        if (q.description) {
          html += `<div class="q-description">${esc(q.description)}</div>`;
        }

        if (q.qtype === 'single') {
          html += `<div class="option-list">`;
          q.options.forEach((opt, i) => {
            html += `<div class="option-item">
              <input type="radio" name="q_${q.id}" id="q_${q.id}_o${i}" value="${esc(opt)}">
              <label for="q_${q.id}_o${i}">${esc(opt)}</label>
            </div>`;
          });
          html += `</div>`;
        } else if (q.qtype === 'multiple') {
          html += `<div class="option-list">`;
          q.options.forEach((opt, i) => {
            html += `<div class="option-item">
              <input type="checkbox" name="q_${q.id}" id="q_${q.id}_o${i}" value="${esc(opt)}">
              <label for="q_${q.id}_o${i}">${esc(opt)}</label>
            </div>`;
          });
          html += `</div>`;
        } else if (q.qtype === 'rating') {
          html += `<div class="option-list" style="display:flex;gap:8px;flex-wrap:wrap">`;
          q.options.forEach((opt, i) => {
            html += `<label style="display:flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer">
              <input type="radio" name="q_${q.id}" id="q_${q.id}_o${i}" value="${esc(opt)}" style="margin:0">
              <span>${esc(opt)}</span>
            </label>`;
          });
          html += `</div>`;
        } else if (q.qtype === 'number') {
          html += `<input type="number" class="text-answer" data-qid="${q.id}" placeholder="请输入数字" style="width:100%">`;
        } else if (q.qtype === 'date') {
          html += `<input type="date" class="text-answer" data-qid="${q.id}" style="width:100%">`;
        } else if (q.qtype === 'text') {
          html += `<textarea class="text-answer" data-qid="${q.id}" placeholder="请输入你的回答..."></textarea>`;
        }

        html += `</div>`;
      }
      return html;
    }

    function renderSubmitBar() {
      const totalRequired = surveyData.questions.filter(q => q.required).length;
      return `<div class="submit-bar">
        <div style="flex:1">
          <div class="progress-info">共 ${surveyData.questions.length} 题，必填 ${totalRequired} 题</div>
          <div id="progress-container" style="margin-top:8px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span style="font-size:13px;color:var(--muted)">答题进度</span>
              <span id="progress-text" style="font-size:12px;color:var(--muted)">0 / ${surveyData.questions.length}</span>
            </div>
            <div style="width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden">
              <div id="progress-bar" style="width:0%;height:100%;background:var(--primary);transition:width 0.3s"></div>
            </div>
          </div>
        </div>
        <button class="btn-submit" id="btn-submit-survey">提交问卷</button>
      </div>`;
    }

    function prefillAnswers(answers) {
      for (const q of surveyData.questions) {
        const ans = answers[String(q.id)];
        if (ans == null) continue;
        
        if (['single', 'rating'].includes(q.qtype)) {
          const radio = document.querySelector(`input[name="q_${q.id}"][value="${CSS.escape(String(ans))}"]`);
          if (radio) radio.checked = true;
        } else if (q.qtype === 'multiple' && Array.isArray(ans)) {
          for (const val of ans) {
            const checkbox = document.querySelector(`input[name="q_${q.id}"][value="${CSS.escape(String(val))}"]`);
            if (checkbox) checkbox.checked = true;
          }
        } else if (['text', 'number', 'date'].includes(q.qtype)) {
          const input = document.querySelector(`.text-answer[data-qid="${q.id}"]`);
          if (input) input.value = ans;
        }
      }
      // 更新进度条
      const event = new Event('input', { bubbles: true });
      document.querySelectorAll('textarea, input[type="number"], input[type="date"]').forEach(el => el.dispatchEvent(event));
      document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => el.dispatchEvent(new Event('change', { bubbles: true })));
    }

    function collectAnswers() {
      const result = {};
      for (const q of surveyData.questions) {
        if (['single', 'rating'].includes(q.qtype)) {
          const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
          if (selected) result[q.id] = selected.value;
        } else if (q.qtype === 'multiple') {
          const checked = document.querySelectorAll(`input[name="q_${q.id}"]:checked`);
          if (checked.length) result[q.id] = Array.from(checked).map(el => el.value);
        } else if (['text', 'number', 'date'].includes(q.qtype)) {
          const input = document.querySelector(`.text-answer[data-qid="${q.id}"]`);
          if (input && input.value.trim()) result[q.id] = input.value.trim();
        }
      }
      return result;
    }

    async function submitSurvey() {
      const btn = $('#btn-submit-survey');
      if (!btn) return;

      // 收集答案
      answers = collectAnswers();

      // 验证必填
      for (const q of surveyData.questions) {
        if (!q.required) continue;
        const ans = answers[q.id];
        if (['single', 'multiple', 'rating'].includes(q.qtype)) {
          if (!ans || (Array.isArray(ans) && !ans.length)) {
            toast(`问题"${q.question}"为必填`, 'error');
            return;
          }
        } else {
          // text, number, date
          if (!ans || !String(ans).trim()) {
            toast(`问题"${q.question}"为必填`, 'error');
            return;
          }
          if (q.qtype === 'number' && isNaN(ans)) {
            toast(`问题"${q.question}"必须为数字`, 'error');
            return;
          }
        }
      }

      btn.disabled = true;
      btn.textContent = '提交中...';

      try {
        const r = await fetch(`/api/survey/${surveyId}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers })
        });
        const d = await r.json();
        if (d.error) {
          // 会话中途失效：去登录页（带 next 回跳），别只弹一条 toast 让已填的答案白填
          if (r.status === 401) {
            location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
            return;
          }
          toast(d.error, 'error');
          btn.disabled = false;
          btn.textContent = '提交问卷';
          return;
        }
        toast('提交成功 ✓');
        // 重新加载显示已提交状态
        await loadSurvey();
      } catch (e) {
        toast('提交失败：' + e.message, 'error');
        btn.disabled = false;
        btn.textContent = '提交问卷';
      }
    }

    function bindEvents() {
      const btn = $('#btn-submit-survey');
      if (btn) btn.addEventListener('click', submitSurvey);
      
      const editBtn = $('#btn-edit-answers');
      if (editBtn) editBtn.addEventListener('click', () => {
        // 滚动到问题列表顶部
        const firstQuestion = document.querySelector('.question-card');
        if (firstQuestion) firstQuestion.scrollIntoView({ behavior: 'smooth', block: 'start' });
        toast('修改你的答案后，点击"提交问卷"即可保存');
      });
      
      // 进度更新
      const progressBar = $('#progress-bar');
      const progressText = $('#progress-text');
      
      function updateProgress() {
        if (!progressBar) return;
        
        let answered = 0;
        for (const q of surveyData.questions) {
          let isAnswered = false;
          if (['text', 'number', 'date'].includes(q.qtype)) {
            const input = document.querySelector(`.text-answer[data-qid="${q.id}"]`);
            isAnswered = input && input.value && input.value.trim() !== '';
          } else {
            const checked = document.querySelectorAll(`input[name="q_${q.id}"]:checked`);
            isAnswered = checked.length > 0;
          }
          if (isAnswered) answered++;
        }
        
        const percent = surveyData.questions.length > 0 ? Math.round((answered / surveyData.questions.length) * 100) : 0;
        progressBar.style.width = percent + '%';
        progressText.textContent = `${answered} / ${surveyData.questions.length}`;
      }
      
      // 监听所有输入框的变化
      document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(el => {
        el.addEventListener('change', updateProgress);
      });
      document.querySelectorAll('textarea, input[type="number"], input[type="date"]').forEach(el => {
        el.addEventListener('input', updateProgress);
      });
      
      // 初始化进度
      updateProgress();
    }

    function toast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;background:var(--card);box-shadow:var(--shadow);z-index:9999;font-size:14px;';
      if (type === 'error') t.style.borderLeft = '3px solid var(--danger)';
      else if (type === 'success') t.style.borderLeft = '3px solid var(--success)';
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    // SVG icons
    document.body.insertAdjacentHTML('afterbegin', `
      <svg style="display:none">
        <symbol id="users" viewBox="0 0 24 24"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></symbol>
        <symbol id="check" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
        <symbol id="clock" viewBox="0 0 24 24"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></symbol>
        <symbol id="lock" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></symbol>
        <symbol id="edit" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
      </svg>
    `);

    loadSurvey();
  </script>
</body>
</html>
